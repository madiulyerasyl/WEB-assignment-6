<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9 - Sequential Animations</title>

    <style>
        #animationArea {
            width: 450px;
            height: 350px;
            border: 2px solid gray;
            margin-top: 20px;
            position: relative;
        }

        #box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            position: absolute;
            top: 0;
            left: 0;
        }

        button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Task 9 - Sequential Animations</h1>

    <button id="startButton">Start Animation</button>
    <button id="resetButton">Reset</button>

    <div id="animationArea">
        <div id="box"></div>
    </div>

    <script src="script.js"></script>
    <script src="../navbar.js"></script>
